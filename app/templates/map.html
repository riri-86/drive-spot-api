<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Drive Route</title>
    <style>
        html, body { height: 100%; margin: 0; }
        #map { height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        function initMap() {
            new google.maps.Map(document.getElementById("map"), {
                center: { lat:34.75, lng: 135.35 },
                zoom: 10,
            });
        }
    </script>
    <script async
        src="https://maps.googleapis.com/maps/api/js?key={{ maps_key }}&loading=async&callback=initMap">
    </script>
</body>
</html>
